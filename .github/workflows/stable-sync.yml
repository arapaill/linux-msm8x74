name: stable-sync

# Keep the integration branches of every maintained series up to date with
# their mainline LTS branch (AGENTS.md section 5). Clean merges are pushed
# directly. A conflict fails that branch's job, names the conflicting files
# and leaves the branch untouched: resolve it by hand (merge stable into the
# branch, fix the conflict, push). Each branch is synced independently, so a
# conflict on one never holds back the others.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so
# notify-kernel-build never sees these merges: after a merge into a branch
# citronics-kernel builds from (the rc branches and 6.12/release) this
# workflow asks citronics-kernel to build the packages itself. A stable merge
# into 6.12/release reaches devices without an rc round (AGENTS.md section 5).
# That needs the KERNEL_DISPATCH_TOKEN secret, a token allowed to send
# repository_dispatch to Citronics/citronics-kernel (Contents: write).

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      max-parallel: 1        # one branch at a time, never in parallel
      matrix:
        include:
          - branch: '6.12/baseline'
            stable: 'linux-6.12.y'
          - branch: '6.12/staging'
            stable: 'linux-6.12.y'
          - branch: '6.12/rc'
            stable: 'linux-6.12.y'
          - branch: '6.12/release'
            stable: 'linux-6.12.y'
          - branch: '6.18/baseline'
            stable: 'linux-6.18.y'
          - branch: '6.18/staging'
            stable: 'linux-6.18.y'
          - branch: '6.18/rc'
            stable: 'linux-6.18.y'
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          filter: blob:none

      - name: Fetch stable ${{ matrix.stable }}
        run: |
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch --no-tags stable ${{ matrix.stable }}

      - name: Merge stable into ${{ matrix.branch }}
        id: merge
        run: |
          git config user.name  "stable-sync bot"
          git config user.email "stable-sync@users.noreply.github.com"
          STABLE=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$STABLE" HEAD; then
            echo "Already up to date with ${{ matrix.stable }}."
            echo "result=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The fetch has no tags, so name the merge after the Makefile version
          VERSION=$(git show "$STABLE:Makefile" | awk -F' = ' '
            /^VERSION =/ {v=$2} /^PATCHLEVEL =/ {p=$2} /^SUBLEVEL =/ {s=$2}
            END {print v "." p "." s}')
          if git merge --no-edit -m "Merge stable Linux $VERSION into ${{ matrix.branch }}" "$STABLE"; then
            git log --oneline -1
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort
            echo "::error title=stable-sync conflict on ${{ matrix.branch }}::Merging Linux $VERSION conflicts in: $CONFLICTS. The branch was left untouched; merge ${{ matrix.stable }} into it by hand."
            exit 1
          fi

      - name: Push
        if: steps.merge.outputs.result == 'merged'
        run: git push origin HEAD:${{ matrix.branch }}

      - name: Request the kernel package build
        if: steps.merge.outputs.result == 'merged' && (endsWith(matrix.branch, '/rc') || endsWith(matrix.branch, '/release'))
        env:
          KERNEL_DISPATCH_TOKEN: ${{ secrets.KERNEL_DISPATCH_TOKEN }}
        run: |
          if [ -z "$KERNEL_DISPATCH_TOKEN" ]; then
            echo "::error::KERNEL_DISPATCH_TOKEN is not set: ${{ matrix.branch }} moved but no kernel package build was requested."
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          curl -sSf -X POST \
            -H "Authorization: Bearer $KERNEL_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Citronics/citronics-kernel/dispatches \
            -d "{\"event_type\":\"kernel-rc-updated\",\"client_payload\":{\"branch\":\"${{ matrix.branch }}\",\"sha\":\"$SHA\"}}"
          echo "Requested a citronics-kernel build for ${{ matrix.branch }} at $SHA."
